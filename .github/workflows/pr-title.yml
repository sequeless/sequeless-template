name: PR title

# Local to each repo until two repos carry it unchanged, then it moves to sequeless-build.
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Lint the PR title as a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm install --no-save @commitlint/cli@^19 @commitlint/config-conventional@^19
          echo "$PR_TITLE" | npx --no-install commitlint --config commitlint.config.mjs
